services:
  mongo:
    image: mongo:7.0
    container_name: hospital-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hms
    volumes:
      - mongo_data:/data/db
    networks:
      - hospital-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/hms
      OTP_EXPIRY: "5"
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "300"
      AUTH_RATE_LIMIT_WINDOW_MS: "900000"
      AUTH_RATE_LIMIT_MAX: "50"
      TRUST_PROXY: "false"
    depends_on:
      - mongo
    networks:
      - hospital-network
    stdin_open: true
    tty: true

volumes:
  mongo_data:

networks:
  hospital-network:
    driver: bridge
